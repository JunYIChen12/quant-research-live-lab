name: Governance

on:
  issues:
    types: [opened, closed, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read

jobs:
  initialize-issue:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python tools/governance.py issue-opened
        env:
          GITHUB_TOKEN: ${{ github.token }}

  transition:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/transition ')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python tools/governance.py transition
        env:
          GITHUB_TOKEN: ${{ github.token }}

  record-verification:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      startsWith(github.event.comment.body, '/verify ')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python tools/governance.py verify
        env:
          GITHUB_TOKEN: ${{ github.token }}

  recompute-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      (github.event.action == 'deleted' || github.event.action == 'edited')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python tools/governance.py recompute
        env:
          GITHUB_TOKEN: ${{ github.token }}

  label-change:
    if: >-
      github.event_name == 'issues' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      startsWith(github.event.label.name, 'status:')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python tools/governance.py label-change
        env:
          GITHUB_TOKEN: ${{ github.token }}

  protect-closed-issue:
    if: github.event_name == 'issues' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python tools/governance.py issue-closed
        env:
          GITHUB_TOKEN: ${{ github.token }}

  pull-request:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      statuses: write
    steps:
      - name: Check out proposed change
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Select trusted checker
        shell: bash
        run: |
          if git show "${{ github.event.pull_request.base.sha }}:tools/governance.py" > "$RUNNER_TEMP/governance.py" 2>/dev/null; then
            echo "Using checker from base commit."
          else
            echo "Bootstrap: base has no trusted checker; fail closed."
            echo "Merge only after ordinary CI passes, then enable governance from main."
            exit 1
          fi
      - name: Check Pull Request governance
        run: python "$RUNNER_TEMP/governance.py" pull-request
        env:
          GITHUB_TOKEN: ${{ github.token }}
