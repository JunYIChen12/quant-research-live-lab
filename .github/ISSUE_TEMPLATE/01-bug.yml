name: Bug report
description: 报告可复现的软件缺陷；不要提交敏感信息。
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "请先脱敏。安全漏洞请按 SECURITY.md 私下报告。"
  - type: textarea
    id: observed
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 内容不含密钥、账户 ID、订单明细或未经脱敏的日志
          required: true
