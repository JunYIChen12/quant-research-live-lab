name: Change proposal
description: 提议功能、策略研究或风险规则变更。
title: "[Proposal]: "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题与证据
    validations:
      required: true
  - type: textarea
